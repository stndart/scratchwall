services:
  scratchwall:
    build:
      context: .
    image: scratchwall:local
    container_name: scratchwall
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      DATA_DIR: /data
      WEB_DIR: /app/web
      VIRTUAL_HOST: scratch.morad.uk
      VIRTUAL_PORT: 8080
    labels:
      # docker-gen pins the container IP; keepalive then 502s after recreate.
      com.github.nginx-proxy.nginx-proxy.keepalive: "disabled"
    volumes:
      - ./data:/data
    networks:
      - homelabinternals
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  homelabinternals:
    external: true

